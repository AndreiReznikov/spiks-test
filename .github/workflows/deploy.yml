name: Build and Deploy

on:
  push:
    branches: [marketplace-test]
  pull_request:
    branches: [marketplace-test]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Gulp build
        run: npx gulp build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/marketplace-test'
        run: npx gulp deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
