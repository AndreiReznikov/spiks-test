<!DOCTYPE html>
<html lang="ru">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="libs/nouislider/nouislider.min.css">
  <link rel="stylesheet" href="css/index.css">
  <title>Marketplace
  </title>
  <body>
    <div class="layout">
      <div class="layout__header">
      </div>
      <div class="layout__main">
        <main class="main">
          <div class="main__logo-wrapper"><a href="/"><img src="assets/media/marketplace-logo.svg"/></a>
          </div>
          <div class="main__search-wrapper">
            <div class="search">
              <input class="search__input" placeholder="Search"/>
            </div>
          </div>
          <div class="main__slider-wrapper">
            <div class="slider">
              <div class="slider__title">Price Range</div>
              <div class="slider__container slider-no-ui"></div>
              <div class="slider__limits">
                <div class="slider__limit-min">0</div>
                <div class="slider__limit-max">100</div>
              </div>
            </div>
          </div>
          <div class="main__badge-wrapper"></div>
          <div class="main__checkbox-list-wrapper">
            <div class="checkbox-list checkbox-list_opened" data-id="0">
              <div class="checkbox-list__title">Classification<span class="checkbox-list__arrow"></span></div>
              <ul class="checkbox-list__list">
                <li class="checkbox-list__item" data-id="00">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Vegetables</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="01">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Carbs</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="02">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Fats</span>
                  </label>
                </li>
              </ul>
            </div>
            <div class="checkbox-list checkbox-list_opened" data-id="1">
              <div class="checkbox-list__title">Delivery Period<span class="checkbox-list__arrow"></span></div>
              <ul class="checkbox-list__list">
                <li class="checkbox-list__item" data-id="10">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">1 h</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="11">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">24 h</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="12">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Today</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="13">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Next Week</span>
                  </label>
                </li>
              </ul>
            </div>
            <div class="checkbox-list checkbox-list_opened" data-id="2">
              <div class="checkbox-list__title">Size<span class="checkbox-list__arrow"></span></div>
              <ul class="checkbox-list__list">
                <li class="checkbox-list__item" data-id="20">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Huge</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="21">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Large</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="22">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Medium</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="23">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Small</span>
                  </label>
                </li>
                <li class="checkbox-list__item" data-id="24">
                  <label class="checkbox-list__item-label">
                    <input class="checkbox-list__item-input" type="checkbox" checked="checked"/><span class="checkbox-list__item-custom-input"></span><span class="checkbox-list__item-text">Tiny</span>
                  </label>
                </li>
              </ul>
            </div>
          </div>
        </main>
      </div>
      <div class="layout__footer">
      </div>
    </div>
    <script src="libs/nouislider/nouislider.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
